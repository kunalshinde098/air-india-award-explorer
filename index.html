<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Air India Award Explorer</title>
<style>
  /* ─── Design tokens ─── */
  :root {
    --bg:       #0a0c10;
    --surface:  #111418;
    --panel:    #16191f;
    --border:   #252a33;
    --border2:  #2e3540;
    --txt:      #e8eaf0;
    --txt2:     #8890a0;
    --txt3:     #5a6272;
    --accent:   #e8522a;        /* Air India terracotta-red */
    --accent2:  #f0793f;
    --gold:     #d4a843;
    --teal:     #2fb8ac;
    --blue:     #3b82f6;
    --green:    #22c55e;
    --radius:   10px;
    --radius2:  16px;
    --shadow:   0 4px 24px rgba(0,0,0,.5);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--txt);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ─── Ambient glow ─── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 70% 40% at 15% 0%, rgba(232,82,42,.12) 0%, transparent 60%),
      radial-gradient(ellipse 50% 30% at 85% 100%, rgba(59,130,246,.07) 0%, transparent 60%);
    pointer-events: none; z-index: 0;
  }

  /* ─── Layout ─── */
  .app { max-width: 1440px; margin: 0 auto; padding: 0 20px 40px; position: relative; z-index: 1; }

  /* ─── Header ─── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 0 18px; gap: 16px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .logo h1 { font-size: 17px; font-weight: 700; letter-spacing: -.3px; color: var(--txt); }
  .logo p  { font-size: 12px; color: var(--txt2); margin-top: 1px; }
  header a {
    font-size: 12px; color: var(--txt3);
    text-decoration: none; transition: color .2s;
  }
  header a:hover { color: var(--accent); }

  /* ─── Stat cards ─── */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px; margin: 18px 0;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .stat-val { font-size: 22px; font-weight: 800; color: var(--txt); line-height: 1; }
  .stat-lbl { font-size: 11px; color: var(--txt2); margin-top: 4px; text-transform: uppercase; letter-spacing: .5px; }

  /* ─── Tabs ─── */
  .tabs {
    display: flex; gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    width: fit-content;
    margin: 18px 0 14px;
  }
  .tab {
    padding: 7px 18px;
    border-radius: 8px; border: none;
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    background: transparent;
    color: var(--txt2);
    transition: all .18s;
    white-space: nowrap;
  }
  .tab.active { background: var(--accent); color: #fff; }
  .tab:hover:not(.active) { background: var(--panel); color: var(--txt); }

  /* ─── Toolbar / filters ─── */
  .toolbar {
    display: grid;
    grid-template-columns: 1fr repeat(4, auto);
    gap: 8px; align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  @media(max-width:900px) {
    .toolbar { grid-template-columns: 1fr 1fr; }
    .toolbar .search-wrap { grid-column: 1/-1; }
  }
  .search-wrap { position: relative; }
  .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--txt3); pointer-events: none; }
  input[type=text], select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--txt);
    font-size: 13px;
    padding: 9px 12px;
    outline: none;
    width: 100%;
    transition: border-color .18s;
  }
  input[type=text] { padding-left: 36px; }
  input[type=text]:focus, select:focus { border-color: var(--accent); }
  select option { background: var(--surface); }
  .clear-btn {
    padding: 9px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--txt2);
    font-size: 12px; cursor: pointer;
    white-space: nowrap;
    transition: all .18s;
  }
  .clear-btn:hover { border-color: var(--accent); color: var(--txt); }

  /* ─── India Finder Panel ─── */
  .finder-panel {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius2);
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .finder-panel h3 {
    font-size: 13px; font-weight: 700; color: var(--accent2);
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 14px;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .finder-row {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 10px; align-items: end;
  }
  @media(max-width:600px) { .finder-row { grid-template-columns: 1fr; } }
  .finder-row label { font-size: 11px; color: var(--txt2); display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .4px; }
  .finder-btn {
    padding: 9px 20px;
    background: var(--accent);
    border: none; border-radius: var(--radius);
    color: #fff; font-size: 13px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
    transition: background .18s;
  }
  .finder-btn:hover { background: var(--accent2); }
  .finder-results { margin-top: 14px; }
  .finder-results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px; margin-top: 10px;
  }
  .finder-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color .18s, transform .15s;
  }
  .finder-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .finder-card-route { font-size: 13px; font-weight: 700; color: var(--txt); }
  .finder-card-meta { font-size: 11px; color: var(--txt2); margin-top: 3px; }
  .finder-card-pts { font-size: 15px; font-weight: 800; color: var(--accent2); margin-top: 6px; }
  .finder-msg { font-size: 12px; color: var(--txt2); font-style: italic; }

  /* ─── Cards view ─── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px;
  }
  .route-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius2);
    padding: 16px;
    transition: border-color .2s, transform .15s;
    cursor: default;
  }
  .route-card:hover { border-color: var(--border2); transform: translateY(-2px); }
  .route-card.intl { border-left: 3px solid var(--accent); }
  .route-card.dom  { border-left: 3px solid var(--teal); }
  .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .card-route { font-size: 16px; font-weight: 800; letter-spacing: -.3px; }
  .card-cities { font-size: 11px; color: var(--txt2); margin-top: 2px; }
  .badge {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
    padding: 3px 7px; border-radius: 6px; white-space: nowrap; flex-shrink: 0;
  }
  .badge-intl { background: rgba(232,82,42,.15); color: var(--accent2); }
  .badge-dom  { background: rgba(47,184,172,.12); color: var(--teal); }
  .card-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 0; border-top: 1px solid var(--border);
    font-size: 12px;
  }
  .card-row:first-child { border-top: none; }
  .card-lbl { color: var(--txt2); }
  .card-val { font-weight: 600; color: var(--txt); }
  .pts-eco  { color: var(--green); }
  .pts-prem { color: var(--teal); }
  .pts-biz  { color: var(--gold); }
  .pts-first{ color: var(--accent2); }

  /* ─── Table view ─── */
  .table-wrap {
    overflow-x: auto;
    border-radius: var(--radius2);
    border: 1px solid var(--border);
  }
  table {
    width: 100%; border-collapse: collapse;
    font-size: 13px;
    min-width: 900px;
  }
  thead { position: sticky; top: 0; z-index: 10; }
  th {
    background: var(--panel);
    padding: 11px 14px;
    text-align: left;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
    color: var(--txt2);
    border-bottom: 1px solid var(--border2);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    transition: color .15s;
  }
  th:hover { color: var(--txt); }
  th .th-inner { display: flex; align-items: center; gap: 4px; }
  th .sort-icon { opacity: .4; font-size: 10px; }
  th.sort-asc .sort-icon, th.sort-desc .sort-icon { opacity: 1; color: var(--accent); }
  td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--txt);
    vertical-align: middle;
  }
  tr:hover td { background: var(--panel); }
  tr:last-child td { border-bottom: none; }

  /* Per-column filters inside table header */
  .col-filter-row th {
    padding: 6px 8px;
    background: var(--surface);
    cursor: default;
  }
  .col-filter-row th:hover { color: var(--txt2); }
  .col-filter {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--txt);
    font-size: 11px;
    padding: 5px 8px;
    outline: none;
  }
  .col-filter:focus { border-color: var(--accent); }

  /* Scope pills in table */
  .pill {
    display: inline-block; padding: 2px 8px;
    border-radius: 20px; font-size: 10px; font-weight: 700; text-transform: uppercase;
  }
  .pill-intl { background: rgba(232,82,42,.13); color: var(--accent2); }
  .pill-dom  { background: rgba(47,184,172,.12); color: var(--teal); }

  /* Points cells */
  .pts { font-weight: 700; }
  .pts-na { color: var(--txt3); font-weight: 400; }

  /* ─── Empty state ─── */
  .empty {
    text-align: center; padding: 60px 20px;
    color: var(--txt2);
  }
  .empty svg { opacity: .25; margin-bottom: 12px; }
  .empty p { font-size: 14px; }

  /* ─── Result count bar ─── */
  .results-bar {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: var(--txt2);
    margin-bottom: 10px;
    flex-wrap: wrap; gap: 8px;
  }
  .results-bar strong { color: var(--txt); }

  /* ─── Scrollbar ─── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* ─── Responsive ─── */
  @media(max-width: 640px) {
    .cards-grid { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2,1fr); }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-icon">✈</div>
      <div>
        <h1>Air India Award Explorer</h1>
        <p>Miles redemption guide &mdash; 588 routes, 107 airports</p>
      </div>
    </div>
    <a href="https://x.com/kunal_shinde" target="_blank" rel="noopener">@kunal_shinde</a>
  </header>

  <!-- Stats -->
  <div class="stats" id="stats"></div>

  <!-- ★ India → Destination Finder -->
  <div class="finder-panel">
    <h3>
      <span>🇮🇳</span> India → Destination Finder
    </h3>
    <div class="finder-row">
      <div>
        <label>Flying from (Indian city)</label>
        <select id="finderFrom">
          <option value="">Any Indian airport</option>
        </select>
      </div>
      <div>
        <label>Destination country</label>
        <select id="finderCountry">
          <option value="">Any country</option>
        </select>
      </div>
      <div>
        <button class="finder-btn" onclick="runFinder()">Find Routes</button>
      </div>
    </div>
    <div class="finder-results" id="finderResults"></div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-wrap">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="search" placeholder="Search city, code, country…">
    </div>
    <select id="scope">
      <option value="">All routes</option>
      <option value="domestic">Domestic</option>
      <option value="international">International</option>
    </select>
    <select id="sortSel">
      <option value="">Default order</option>
      <option value="eco_asc">Economy ↑</option>
      <option value="eco_desc">Economy ↓</option>
      <option value="biz_asc">Business ↑</option>
      <option value="dist_desc">Distance ↓</option>
      <option value="dist_asc">Distance ↑</option>
    </select>
    <button class="clear-btn" onclick="clearAll()">Clear filters</button>
  </div>

  <!-- View tabs -->
  <div class="tabs">
    <button class="tab active" data-view="cards">Cards</button>
    <button class="tab" data-view="table">Table</button>
  </div>

  <div class="results-bar">
    <span id="resultsLabel"></span>
  </div>

  <!-- Views -->
  <div id="cardsView"></div>
  <div id="tableView" style="display:none"></div>

</div>

function city(code) { return AP[code]?.c || code; }
function country(code) { return AP[code]?.co || 'Other'; }

// Enrich routes
const ROUTES = window.ROUTES.map(r => ({
  ...r,
  from_city: city(r.from),
  to_city: city(r.to),
  to_country: country(r.to),
  from_country: country(r.from),
  eco:  +r.economy_min  || 0,
  prem: +r.premium_min  || 0,
  biz:  +r.business_min || 0,
  first:+r.first_min    || 0,
  dist: +r.distance_km  || 0,
}));

// Identify Indian airports
const INDIA_CODES = new Set(ROUTES.filter(r=>r.scope==='domestic').flatMap(r=>[r.from,r.to]));

// Build country → airports map for finder
const COUNTRY_MAP = {};
ROUTES.forEach(r => {
  if (!INDIA_CODES.has(r.to)) {
    if (!COUNTRY_MAP[r.to_country]) COUNTRY_MAP[r.to_country] = new Set();
    COUNTRY_MAP[r.to_country].add(r.to);
  }
});

// ── Populate dropdowns ──────────────────────────────────
const finderFrom = document.getElementById('finderFrom');
const finderCountry = document.getElementById('finderCountry');

// Indian airports sorted by city name
[...INDIA_CODES].sort((a,b)=>city(a).localeCompare(city(b))).forEach(code => {
  const o = document.createElement('option');
  o.value = code; o.text = `${city(code)} (${code})`;
  finderFrom.appendChild(o);
});

// Countries (from intl routes departing India) sorted
Object.keys(COUNTRY_MAP).sort().forEach(co => {
  if (co === 'India') return;
  const o = document.createElement('option');
  o.value = co; o.text = co;
  finderCountry.appendChild(o);
});

// ── State ───────────────────────────────────────────────
let currentView = 'cards';
let tableSortCol = null, tableSortDir = 1;
const colFilters = {}; // col → value

// ── India Finder ────────────────────────────────────────
function runFinder() {
  const fromCode = finderFrom.value;
  const destCountry = finderCountry.value;
  const el = document.getElementById('finderResults');

  // Find routes: from Indian airport → destination matching country
  let results = ROUTES.filter(r => {
    if (r.scope !== 'international') return false;
    if (!INDIA_CODES.has(r.from)) return false;
    if (fromCode && r.from !== fromCode) return false;
    if (destCountry && r.to_country !== destCountry) return false;
    return true;
  });

  // Sort by economy
  results.sort((a,b) => (a.eco||999999)-(b.eco||999999));

  // Dedupe: best (lowest economy) per to-airport
  const seen = new Set();
  results = results.filter(r => {
    const key = r.from+'|'+r.to;
    if (seen.has(key)) return false;
    seen.add(key); return true;
  });

  if (!results.length) {
    el.innerHTML = `<p class="finder-msg">No matching routes found. Try changing origin or destination.</p>`;
    return;
  }

  el.innerHTML = `
    <p class="finder-msg">${results.length} route${results.length!==1?'s':''} found — click any to see full details in the table</p>
    <div class="finder-results-grid">
      ${results.slice(0,12).map(r=>`
        <div class="finder-card" onclick="jumpToRoute('${r.from}','${r.to}')">
          <div class="finder-card-route">${r.from} → ${r.to}</div>
          <div class="finder-card-meta">${r.from_city} → ${r.to_city}, ${r.to_country}</div>
          <div class="finder-card-pts">
            Eco: ${r.eco ? r.eco.toLocaleString() : '—'} pts
            ${r.biz ? ` · Biz: ${r.biz.toLocaleString()}` : ''}
          </div>
          <div class="finder-card-meta">${r.dist ? r.dist.toLocaleString()+' km' : ''}</div>
        </div>`).join('')}
    </div>`;
}

function jumpToRoute(from, to) {
  // Switch to table, filter by these airports
  switchView('table');
  document.getElementById('search').value = from + ' ' + to;
  apply();
  // Scroll to table
  document.getElementById('tableView').scrollIntoView({behavior:'smooth', block:'start'});
}

// ── Main apply / render ─────────────────────────────────
function apply() {
  let r = [...ROUTES];
  const q = document.getElementById('search').value.toLowerCase().trim();
  const sc = document.getElementById('scope').value;
  const sort = document.getElementById('sortSel').value;

  // Global search
  if (q) {
    const terms = q.split(/\s+/);
    r = r.filter(x => terms.every(t =>
      x.from.toLowerCase().includes(t) ||
      x.to.toLowerCase().includes(t) ||
      x.from_city.toLowerCase().includes(t) ||
      x.to_city.toLowerCase().includes(t) ||
      x.to_country.toLowerCase().includes(t) ||
      x.scope.includes(t)
    ));
  }
  if (sc) r = r.filter(x => x.scope === sc);

  // Global sort
  if (sort === 'eco_asc')  r.sort((a,b) => (a.eco||999999)-(b.eco||999999));
  if (sort === 'eco_desc') r.sort((a,b) => (b.eco||0)-(a.eco||0));
  if (sort === 'biz_asc')  r.sort((a,b) => (a.biz||999999)-(b.biz||999999));
  if (sort === 'dist_desc')r.sort((a,b) => b.dist-a.dist);
  if (sort === 'dist_asc') r.sort((a,b) => a.dist-b.dist);

  // Table column sort overrides if in table view
  if (currentView === 'table' && tableSortCol) {
    r = sortByCol(r, tableSortCol, tableSortDir);
  }

  renderStats(r);
  if (currentView === 'cards') renderCards(r);
  else renderTable(r);

  const label = document.getElementById('resultsLabel');
  label.textContent = `${r.length} of ${ROUTES.length} routes`;
}

function sortByCol(r, col, dir) {
  return [...r].sort((a,b) => {
    let va = a[col], vb = b[col];
    if (col === 'eco' || col === 'biz' || col === 'prem' || col === 'first' || col === 'dist') {
      va = va||0; vb = vb||0;
      return (va-vb)*dir;
    }
    va = String(va||''); vb = String(vb||'');
    return va.localeCompare(vb)*dir;
  });
}

function pts(v) {
  return v ? v.toLocaleString() : '<span class="pts-na">—</span>';
}

// ── Stats ───────────────────────────────────────────────
function renderStats(r) {
  const dom  = r.filter(x=>x.scope==='domestic').length;
  const intl = r.filter(x=>x.scope==='international').length;
  const minEco = Math.min(...r.filter(x=>x.eco>0).map(x=>x.eco));
  const countries = new Set(r.map(x=>x.to_country)).size;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-val">${r.length}</div><div class="stat-lbl">Total Routes</div></div>
    <div class="stat"><div class="stat-val">${dom}</div><div class="stat-lbl">Domestic</div></div>
    <div class="stat"><div class="stat-val">${intl}</div><div class="stat-lbl">International</div></div>
    <div class="stat"><div class="stat-val">${countries}</div><div class="stat-lbl">Countries</div></div>
    <div class="stat"><div class="stat-val">${isFinite(minEco)?minEco.toLocaleString():'—'}</div><div class="stat-lbl">Lowest Economy (pts)</div></div>
  `;
}

// ── Cards ────────────────────────────────────────────────
function renderCards(r) {

        ${x.prem?`<div class="card-row"><span class="card-lbl">Premium</span><span class="card-val pts-prem">${x.prem.toLocaleString()} pts</span></div>`:''}
        ${x.biz ?`<div class="card-row"><span class="card-lbl">Business</span><span class="card-val pts-biz">${x.biz.toLocaleString()} pts</span></div>`:''}
        ${x.first?`<div class="card-row"><span class="card-lbl">First</span><span class="card-val pts-first">${x.first.toLocaleString()} pts</span></div>`:''}
        <div class="card-row"><span class="card-lbl">Distance</span><span class="card-val">${x.dist?x.dist.toLocaleString()+' km':'—'}</span></div>
      </div>`).join('')

}

  {key:'eco',       label:'Economy'},
  {key:'prem',      label:'Premium'},
  {key:'biz',       label:'Business'},
  {key:'first',     label:'First'},
  {key:'dist',      label:'Distance'},
];

function sortArrow(col) {
  if (tableSortCol !== col) return `<span class="sort-icon">↕</span>`;
  return tableSortDir === 1 ? `<span class="sort-icon">↑</span>` : `<span class="sort-icon">↓</span>`;
}

function renderTable(r) {
  // Apply per-column filters on top
  let filtered = r;
  Object.entries(colFilters).forEach(([col, val]) => {
    if (!val) return;
    const v = val.toLowerCase();
    filtered = filtered.filter(row => String(row[col]||'').toLowerCase().includes(v));
  });

  const tableView = document.getElementById('tableView');
  const thClass = col => tableSortCol===col ? (tableSortDir===1?'sort-asc':'sort-desc') : '';

  // ── One-time: build the full table shell (header + tbody) ──
  // Only rebuild the entire structure when the table wrapper doesn't exist yet,
  // OR when a global filter/sort changed (not a col-filter keystroke).
  // We detect "col-filter keystroke" via the _colFilterActive flag set in setColFilter.
  const needsFullRebuild = !tableView.querySelector('table') || !tableView._tableReady;

  if (needsFullRebuild) {
    tableView.innerHTML = `
    <div class="table-wrap">
      <table id="mainTable">
        <thead>
          <tr id="theadSortRow">
            ${COLS.map(c=>`
              <th class="${thClass(c.key)}" onclick="toggleSort('${c.key}')">
                <div class="th-inner">${c.label} ${sortArrow(c.key)}</div>
              </th>`).join('')}
          </tr>
          <tr class="col-filter-row" id="theadFilterRow">
            ${COLS.map(c=>`
              <th>
                <input class="col-filter" data-col="${c.key}" placeholder="Filter…"
                  value="${colFilters[c.key]||''}">
              </th>`).join('')}
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>`;

    // Attach listeners once — oninput on the filter row (event delegation)
    tableView.querySelector('#theadFilterRow').addEventListener('input', e => {
      const input = e.target.closest('input[data-col]');
      if (input) setColFilter(input.dataset.col, input.value);
    });

    tableView._tableReady = true;
  } else {
    // Just refresh sort-header classes & arrows without touching inputs
    const sortRow = tableView.querySelector('#theadSortRow');
    sortRow.querySelectorAll('th').forEach((th, i) => {
      const col = COLS[i].key;
      th.className = thClass(col);
      th.querySelector('.th-inner').innerHTML = `${COLS[i].label} ${sortArrow(col)}`;
    });
  }

  // ── Always: update only the tbody rows ──
  const tbody = tableView.querySelector('#tableBody');
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="${COLS.length}" style="text-align:center;padding:40px;color:var(--txt2)">No routes match your filters.</td></tr>`;
    return;
  }
  tbody.innerHTML = filtered.map(x=>`<tr>
    <td>${x.from_city}</td>
    <td><strong>${x.from}</strong></td>
    <td>${x.to_city}</td>
    <td><strong>${x.to}</strong></td>
    <td>${x.to_country}</td>
    <td><span class="pill ${x.scope==='international'?'pill-intl':'pill-dom'}">${x.scope==='international'?'Intl':'Dom'}</span></td>
    <td class="pts pts-eco">${pts(x.eco)}</td>
    <td class="pts pts-prem">${pts(x.prem)}</td>
    <td class="pts pts-biz">${pts(x.biz)}</td>
    <td class="pts pts-first">${pts(x.first)}</td>
    <td>${x.dist?x.dist.toLocaleString()+' km':'—'}</td>
  </tr>`).join('');
}

function toggleSort(col) {
  if (tableSortCol === col) tableSortDir *= -1;
  else { tableSortCol = col; tableSortDir = 1; }
  // Don't force full rebuild — the else-branch in renderTable will refresh sort headers in place
  apply();
}

function setColFilter(col, val) {
  colFilters[col] = val;
  apply();
}

function emptyState() {
  return `<div class="empty">
    <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <p>No routes match your filters. Try broadening your search.</p>
  </div>`;
}

// ── Tabs ────────────────────────────────────────────────
function switchView(view) {
  currentView = view;
  document.getElementById('cardsView').style.display = view==='cards' ? 'block' : 'none';
  document.getElementById('tableView').style.display = view==='table' ? 'block' : 'none';
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.view === view);
  });
  // Force full header rebuild when switching to table view
  const tv = document.getElementById('tableView');
  if (view === 'table') tv._tableReady = false;
  apply();
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => switchView(t.dataset.view));
});

// ── Global filters ──────────────────────────────────────
['search','scope','sortSel'].forEach(id => {
  document.getElementById(id).addEventListener('input', apply);
});

function clearAll() {
  document.getElementById('search').value = '';
  document.getElementById('scope').value = '';
  document.getElementById('sortSel').value = '';
  tableSortCol = null; tableSortDir = 1;
  Object.keys(colFilters).forEach(k => delete colFilters[k]);
  // Force full header rebuild so filter inputs show as empty
  document.getElementById('tableView')._tableReady = false;
  apply();
}

// ── Init ────────────────────────────────────────────────
apply();
</script>
</body>
</html>
